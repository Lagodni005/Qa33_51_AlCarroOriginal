plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.50.0")
    implementation("org.testng:testng:7.12.0")

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation 'ch.qos.logback:logback-classic:1.5.8'

    testImplementation 'io.qameta.allure:allure-testng:2.29.1'
    implementation 'io.qameta.allure:allure-java-commons:2.29.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'io.rest-assured:rest-assured:5.5.6'

}

test {
    useTestNG {
        listeners.add('io.qameta.allure.testng.AllureTestNg')
    }
}

tasks.register('qa', Test) {
    useTestNG() {
        listeners.add('io.qameta.allure.testng.AllureTestNg')

        def suite = System.getProperty('suite', '')
        if (suite.equals('quick')) {
            suites 'src/test/resources/quick.xml'
        } else if (suite.equals('login')) {
            suites 'src/test/resources/login.xml'
        } else {
            suites 'src/test/resources/testng.xml'
        }

    }

    if (project.hasProperty('browser')) {
        systemProperty 'browser', "${browser}"
    }
}


tasks.register('scope', Test) {
    useTestNG() {
        listeners.add('io.qameta.allure.testng.AllureTestNg')
        suites 'src/test/resources/scope.xml'
    }

    if (project.hasProperty('browser')) {
        systemProperty 'browser', "${browser}"
    }
}


tasks.register('groups', Test) {
    useTestNG() {
        listeners.add('io.qameta.allure.testng.AllureTestNg')
        def groups = System.getProperty('groups')
        if (groups != null) {
            includeGroups groups
        }
        suites 'src/test/resources/base.xml'
    }
}